<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#080c16" />
      <stop offset="50%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#050811" />
    </linearGradient>

    <!-- Spark Gold-Cyan Gradient -->
    <linearGradient id="sparkTextGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#fffb00" />
      <stop offset="35%" stop-color="#ff007f" />
      <stop offset="70%" stop-color="#00f0ff" />
      <stop offset="100%" stop-color="#ffffff" />
    </linearGradient>

    <linearGradient id="sparkGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fff570" />
      <stop offset="100%" stop-color="#ff9900" />
    </linearGradient>

    <!-- Glowing Filters -->
    <filter id="glowCyan" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <filter id="glowPink" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <filter id="glowSpark" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="blur" />
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Base Rounded Container -->
  <rect width="512" height="512" rx="115" fill="url(#bgGrad)" stroke="#1e293b" stroke-width="6"/>

  <!-- Subtle Neon Background Ring -->
  <circle cx="256" cy="210" r="150" fill="none" stroke="#00f0ff" stroke-width="2" opacity="0.15" stroke-dasharray="8 12"/>

  <!-- Tic Tac Toe Grid Lines -->
  <g stroke="#334155" stroke-width="10" stroke-linecap="round" opacity="0.55">
    <line x1="185" y1="80" x2="185" y2="340" stroke="#38bdf8" />
    <line x1="327" y1="80" x2="327" y2="340" stroke="#38bdf8" />
    <line x1="85" y1="165" x2="427" y2="165" stroke="#38bdf8" />
    <line x1="85" y1="265" x2="427" y2="265" stroke="#38bdf8" />
  </g>

  <!-- Neon X (Top-Left) -->
  <g stroke="#00f0ff" stroke-width="24" stroke-linecap="round" filter="url(#glowCyan)">
    <line x1="110" y1="95" x2="160" y2="145" />
    <line x1="160" y1="95" x2="110" y2="145" />
  </g>

  <!-- Neon O (Center-Right) -->
  <circle cx="377" cy="215" r="38" fill="none" stroke="#ff007f" stroke-width="22" filter="url(#glowPink)"/>

  <!-- Neon X (Bottom-Left) -->
  <g stroke="#00f0ff" stroke-width="22" stroke-linecap="round" filter="url(#glowCyan)">
    <line x1="115" y1="285" x2="155" y2="325" />
    <line x1="155" y1="285" x2="115" y2="325" />
  </g>

  <!-- Central Neon O -->
  <circle cx="256" cy="215" r="32" fill="none" stroke="#ffd700" stroke-width="16" filter="url(#glowSpark)" opacity="0.9"/>

  <!-- Electric Sparks (4-point Stars & Lightning) around Furus -->
  <!-- Spark 1 (Top Left of Furus) -->
  <path d="M 85,385 Q 85,397 73,397 Q 85,397 85,409 Q 85,397 97,397 Q 85,397 85,385 Z" fill="#fffb00" filter="url(#glowSpark)"/>
  <circle cx="85" cy="397" r="3" fill="#ffffff" />

  <!-- Spark 2 (Top Right of Furus) -->
  <path d="M 427,385 Q 427,397 415,397 Q 427,397 427,409 Q 427,397 439,397 Q 427,397 427,385 Z" fill="#00f0ff" filter="url(#glowSpark)"/>
  <circle cx="427" cy="397" r="3" fill="#ffffff" />

  <!-- Spark 3 (Little spark near center) -->
  <path d="M 175,372 Q 175,380 167,380 Q 175,380 175,388 Q 175,380 183,380 Q 175,380 175,372 Z" fill="#ff007f" filter="url(#glowPink)"/>

  <!-- Spark 4 (Little spark near right) -->
  <path d="M 345,370 Q 345,377 338,377 Q 345,377 345,384 Q 345,377 352,377 Q 345,377 345,370 Z" fill="#fffb00" filter="url(#glowSpark)"/>

  <!-- Lightning Bolt Spark (Left side) -->
  <polygon points="68,435 82,410 75,410 88,385 72,413 79,413" fill="#ffd700" filter="url(#glowSpark)"/>
  
  <!-- Lightning Bolt Spark (Right side) -->
  <polygon points="444,435 430,410 437,410 424,385 440,413 433,413" fill="#00f0ff" filter="url(#glowCyan)"/>

  <!-- Glowing Badge Plate for FURUS -->
  <rect x="70" y="380" width="372" height="92" rx="26" fill="#0a1020" stroke="url(#sparkTextGrad)" stroke-width="3.5" filter="url(#glowSpark)"/>

  <!-- Ambient Glow Under Text -->
  <ellipse cx="256" cy="426" rx="140" ry="24" fill="#00f0ff" opacity="0.25" filter="url(#glowCyan)"/>

  <!-- "FURU" BOLD NEON SPARK TEXT -->
  <text x="256" y="445" 
        text-anchor="middle" 
        font-family="Impact, Arial Black, Montserrat, sans-serif" 
        font-size="66" 
        font-weight="900" 
        letter-spacing="14" 
        fill="url(#sparkTextGrad)" 
        stroke="#ffffff" 
        stroke-width="1.5"
        filter="url(#glowSpark)">
    FURU
  </text>

  <!-- Additional Spark Dust -->
  <circle cx="108" cy="460" r="2.5" fill="#fff" opacity="0.9" filter="url(#glowSpark)"/>
  <circle cx="210" cy="386" r="2" fill="#ffd700" opacity="0.9"/>
  <circle cx="305" cy="384" r="2" fill="#00f0ff" opacity="0.9"/>
  <circle cx="400" cy="460" r="2.5" fill="#ff007f" opacity="0.9"/>
</svg>
